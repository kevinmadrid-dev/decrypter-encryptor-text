<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encriptador de Texto</title>

    <link rel="icon" type="image/png" href="./assets/img/logoBuscando.png" />
    <link rel="apple-touch-icon" href="./assets/img/logoBuscando.png" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Mensajes de notificación -->
    <div class="message" id="div_pantallaid" style="display: none">
      <p>Campo vacío. Por favor, ingresa texto.</p>
    </div>

    <div
      class="message message--success"
      id="div_pantalla_copiarid"
      style="display: none"
    >
      <p>¡Texto copiado correctamente!</p>
    </div>

    <div class="app-container">
      <header class="header">
        <h1 class="header__title">Encriptador de Texto</h1>
      </header>

      <main class="main-content">
        <section class="input-section">
          <div class="textarea-container">
            <textarea
              id="text_area_entradaid"
              class="textarea"
              placeholder="Escribe tu texto aquí..."
              spellcheck="false"
            ></textarea>
            <p class="input-hint">⚠️ Solo letras minúsculas y sin acentos</p>
          </div>

          <div class="buttons-container">
            <button type="button" id="btn_encriptarid" class="btn btn--primary">
              🔒 Encriptar
            </button>

            <button
              type="button"
              id="btn_desencriptarid"
              class="btn btn--secondary"
            >
              🔓 Desencriptar
            </button>

            <button type="button" id="btn_borrarid" class="btn btn--clear">
              🗑️ Limpiar
            </button>
          </div>
        </section>

        <section class="output-section">
          <div class="output-placeholder" id="div_img_pTextoid">
            <div class="placeholder-content">
              <div class="placeholder-icon">🔍</div>

              <h3>Ningún mensaje fue encontrado</h3>

              <p>Ingresa el texto que desees encriptar o desencriptar</p>
            </div>
          </div>

          <div
            class="output-container"
            id="div_text_area_salidaid"
            style="display: none"
          >
            <div class="textarea-container">
              <textarea
                id="text_area_salidaid"
                class="textarea textarea--output"
                readonly
              ></textarea>
            </div>

            <button type="button" id="btn_copiarid" class="btn btn--copy">
              📋 Copiar
            </button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="social-links">
          <a
            href="https://github.com/kevinmadrid-dev"
            target="_blank"
            rel="noopener"
            class="social-link"
          >
            <img src="./assets/img/github.png" alt="GitHub" />
          </a>

          <a
            href="https://www.linkedin.com/in/kevinmadrid-dev/"
            target="_blank"
            rel="noopener"
            class="social-link"
          >
            <img src="./assets/img/linkeding.png" alt="LinkedIn" />
          </a>
        </div>
        
        <p class="footer__copy">© 2025 Kevin Madrid.</p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
